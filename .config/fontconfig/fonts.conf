<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias><family>monospace</family><prefer>
    <family>IosevkaTerm Nerd Font Mono</family>
    <family>IBM Plex Mono</family>
    <family>Noto Sans Symbols 2</family>
  </prefer></alias>

  <alias><family>sans-serif</family><prefer>
    <family>IBM Plex Sans</family>
    <family>Liberation Sans</family>
    <family>Adwaita Sans</family>
    <family>Noto Sans Symbols 2</family>
  </prefer></alias>

  <alias><family>serif</family><prefer>
    <family>IBM Plex Serif</family>
    <family>Liberation Serif</family>
    <family>Noto Sans Symbols 2</family>
  </prefer></alias>
</fontconfig>
